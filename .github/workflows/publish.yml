name: Publish to npm

on:
  push:
    tags:
      - 'v*.*.*'  # 触发条件：推送 v0.1.0 格式的 tag

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 创建 GitHub Release 需要

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install

      - name: Build packages
        run: |
          cd packages/core && bun run build

      - name: Run tests
        run: bun test

      - name: Size and dependency gates
        run: packages/core/scripts/check-budget.sh

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          # 0.4.0-beta.0 and the like must not become the "latest" dist-tag
          if [[ "$VERSION" == *-* ]]; then echo "PRERELEASE=true" >> $GITHUB_OUTPUT; else echo "PRERELEASE=false" >> $GITHUB_OUTPUT; fi

      - name: Update package version
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          cd packages/core
          sed -i "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" package.json

      - name: Publish @hold-baby/bucket-db
        working-directory: packages/core
        run: npm publish --access public ${{ steps.version.outputs.PRERELEASE == 'true' && '--tag next' || '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ steps.version.outputs.VERSION }}
          body: |
            ## 📦 Published to npm

            - `@hold-baby/bucket-db@${{ steps.version.outputs.VERSION }}`

            Install:
            ```bash
            bun add @hold-baby/bucket-db
            ```
          draft: false
          prerelease: ${{ steps.version.outputs.PRERELEASE == 'true' }}
