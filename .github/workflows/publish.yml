name: Publish to npm

on:
  push:
    tags:
      - 'v*.*.*'  # 触发条件：推送 v0.1.0 格式的 tag

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 创建 GitHub Release 需要
      id-token: write  # npm trusted publishing (OIDC) and provenance

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Trusted publishing needs Node >= 22.14 and npm >= 11.5.1
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Update npm
        run: npm install -g npm@11

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build packages
        run: |
          cd packages/core && bun run build

      - name: Run tests
        run: bun test

      - name: Size and dependency gates
        run: packages/core/scripts/check-budget.sh

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          # 0.4.0-beta.0 and the like must not become the "latest" dist-tag
          if [[ "$VERSION" == *-* ]]; then echo "PRERELEASE=true" >> $GITHUB_OUTPUT; else echo "PRERELEASE=false" >> $GITHUB_OUTPUT; fi

      - name: Update package version
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          cd packages/core
          sed -i "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" package.json

      # Authenticates through the npm trusted publisher configured for this
      # repository and workflow; NPM_TOKEN is only a fallback.
      - name: Publish @hold-baby/bucket-db
        working-directory: packages/core
        run: npm publish --access public ${{ steps.version.outputs.PRERELEASE == 'true' && '--tag next' || '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.VERSION }}
          PRERELEASE: ${{ steps.version.outputs.PRERELEASE }}
        run: |
          # release notes: this version's section of CHANGELOG.md
          awk -v v="$VERSION" 'index($0, "## [" v "]") == 1 {on=1; next} on && /^## \[/ {exit} on' CHANGELOG.md > notes.md
          flags=()
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "v$VERSION" --title "v$VERSION" --notes-file notes.md "${flags[@]}"
