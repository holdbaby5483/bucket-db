name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  BUN_VERSION: 1.4.2

jobs:
  unit-test:
    name: Unit tests, examples and size gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build packages
        run: bun run build

      - name: Run unit tests
        run: bun test

      - name: Run examples
        run: |
          for example in basic-usage local-storage dbpath-demo; do
            (cd "examples/$example" && bun run index.ts)
          done

      - name: Size and dependency gates
        run: packages/core/scripts/check-budget.sh

  node:
    name: Node ${{ matrix.node }} smoke test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build core
        run: bun run --cwd packages/core build

      - name: Run the built package on Node
        run: node packages/core/scripts/node-smoke.mjs

      - name: Run the built CLI on Node
        env:
          BUCKET_DB_URL: file://${{ runner.temp }}/cli-smoke
        run: |
          cli="node packages/core/dist/cli.js"
          echo '{"ms":42}' | $cli put runs sha-1
          test "$($cli count runs '{"ms":{"$gt":10}}')" = 1
          $cli export runs | $cli import copy
          $cli get copy sha-1 | grep -q '"ms":42'
          $cli doctor
          if $cli get runs missing; then exit 1; else test $? -eq 2; fi

  local-s3:
    name: Conformance on a local S3 (SeaweedFS)
    runs-on: ubuntu-latest
    env:
      SEAWEEDFS_VERSION: '4.54'
      LOCAL_S3_ENDPOINT: http://127.0.0.1:8333
      LOCAL_S3_BUCKET: bucketdb-ci
      LOCAL_S3_ACCESS_KEY_ID: test
      LOCAL_S3_SECRET_ACCESS_KEY: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Start SeaweedFS
        run: |
          curl -sSL "https://github.com/seaweedfs/seaweedfs/releases/download/${SEAWEEDFS_VERSION}/linux_amd64.tar.gz" | tar xz -C "$RUNNER_TEMP"
          echo '{"identities":[{"name":"ci","credentials":[{"accessKey":"test","secretKey":"test"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' > "$RUNNER_TEMP/s3.json"
          mkdir -p "$RUNNER_TEMP/data"
          "$RUNNER_TEMP/weed" server -dir="$RUNNER_TEMP/data" -ip=127.0.0.1 -s3 -s3.port=8333 -s3.config="$RUNNER_TEMP/s3.json" > "$RUNNER_TEMP/weed.log" 2>&1 &
          for attempt in $(seq 60); do
            if curl -sf --aws-sigv4 'aws:amz:us-east-1:s3' --user test:test -X PUT "$LOCAL_S3_ENDPOINT/$LOCAL_S3_BUCKET" -o /dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/weed.log"
          exit 1

      - name: Run conformance and multi-process tests
        run: bun test packages/core/tests/conformance/local-s3.test.ts packages/core/tests/core/multiprocess.test.ts

  integration-test:
    name: Conformance on real OSS
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run conformance and multi-process tests against OSS
        env:
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
          OSS_REGION: ${{ secrets.OSS_REGION }}
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: bun test packages/core/tests/conformance/real-buckets.test.ts packages/core/tests/core/multiprocess.test.ts
